<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ note.metadata.title }} — Hunch</title>
  <style>
    body { font-family: Georgia, serif; max-width: 720px; margin: 3rem auto; padding: 0 1.5rem; line-height: 1.7; color: #222; }
    nav { font-family: sans-serif; font-size: 0.9rem; margin-bottom: 2rem; }
    nav a { color: #555; text-decoration: none; }
    h1 { font-size: 2rem; margin-bottom: 0.25rem; }
    .meta { font-family: sans-serif; font-size: 0.85rem; color: #777; margin-bottom: 2rem; }
    .category { background: #f0f0f0; border-radius: 3px; padding: 0.1rem 0.4rem; }
    pre { background: #f6f6f6; padding: 1rem; overflow-x: auto; border-radius: 4px; }
    code { font-size: 0.9rem; }
    a { color: #2563eb; }
  </style>
</head>
<body>
  <nav><a href="../index.html">← All notes</a></nav>
  <h1>{{ note.metadata.title }}</h1>
  <div class="meta">
    {% if note.metadata.date %}<span>{{ note.metadata.date }}</span>{% endif %}
    {% if note.metadata.category %}
      <span class="category">{{ note.metadata.category }}</span>
    {% endif %}
  </div>
  <article>
    {{ body_html | safe }}
  </article>
</body>
</html>
