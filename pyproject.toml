[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hunch"
version = "0.2.0"
description = "A lightweight personal notes publisher"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hunch"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
